app = "odidudidis"

primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

# تعريف نقاط التثبيت (mounts)
[[mounts]]
  source = "data"
  destination = "/data"

# ربط مأخذ Docker من المضيف إلى الحاوية
[[mounts]]
  source = "docker_socket"
  destination = "/var/run/docker.sock"

# مجلد دائم لتخزين بيانات المستخدمين (عزل الحاويات)
[[mounts]]
  source = "user_data"
  destination = "/app/user_data"

# متغيرات البيئة
[env]
  DOCKER_HOST = "unix:///var/run/docker.sock"
  USER_DATA_DIR = "/app/user_data"

[http_service]
  internal_port = 8085
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "performance"   # تم التغيير من shared إلى performance لدعم الموارد الكبيرة
  cpus = 16                  # 16 وحدة معالجة مركزية
  memory_mb = 131072         # 128 جيجابايت = 128 * 1024 = 131072 ميجابايت
